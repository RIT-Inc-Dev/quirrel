name: CI

on:
  push:
    branches: [feature/rit]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        # wait until redis has started
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    env:
      REDIS_URL: redis://localhost:6379
      DISABLE_TELEMETRY: true

    steps:
    - uses: actions/checkout@v5
    - uses: jdx/mise-action@v3
    - run: bun install --frozen-lockfile
    - run: bun install --frozen-lockfile
      working-directory: development-ui
    - run: bun run lint
    # development-ui type-checks against the built client (dist + root proxies)
    - run: bun run build
    - run: bun run type-check
    - run: bun run test --coverage --coverage-reporter=lcov
    # Node-only paths (e.g. SSRF prevention) against the built server
    - run: bun run test:node
    - name: Coveralls Quirrel
      uses: coverallsapp/github-action@master
      with:
        flag-name: quirrel
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: coverage/lcov.info
        parallel: true
    - name: Install Playwright Browsers
      run: bunx playwright install --with-deps
      working-directory: development-ui
    - run: bun run test:ci
      working-directory: development-ui
    - name: Coveralls Finished
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        parallel-finished: true

  docker:
    # Build only; images are published by release.yml on version tags
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
